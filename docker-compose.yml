services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped

    depends_on:
      - db

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
